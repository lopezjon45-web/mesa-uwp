# DXBC backend checks for the Xbox One S port (branch dxbc-port).
#
# windows: reuses the desktop Mesa build that one-s.yml caches (same key), builds glprobe and dxbccheck,
#          runs a scene subset on the DXIL path, at shader model 5.1 (the One S) and at 5.0, comparing the
#          5.x images with the DXIL images from the same run, dumps every DXBC blob, measures compile time,
#          checks each blob with D3DDisassemble and D3D11 FL 11_0, and answers the zero-digest question
#          with FXC-built blobs.
# disasm:  disassembles every dumped blob with dxbc-spirv (MIT) as a second, open-source structural check.
name: dxbc-port

on:
  push:
    branches: [dxbc-port]
  workflow_dispatch:

permissions:
  contents: read

env:
  MESON_TAG: 1.4.2
  POWERSHELL_TELEMETRY_OPTOUT: 1
  # The brief's three targets first, then the rest of what SM 5 must carry for xemu.
  SCENES: triangle_basic,uniforms,ubo_binding,tex2d,geometry_shader,alu_int,int_div,bitfield_ops,float_bits,alu_float,varying_smooth,varying_flat,discard,instancing,mrt,tex_cube,tex_shadow,texel_fetch,loops_branches,derivatives

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        shell: pwsh
        run: |
          python -m pip install --quiet mako pyyaml packaging ninja
          choco install winflexbison3 -y --no-progress | Out-Null
          git -c core.autocrlf=false clone --quiet --depth 1 --branch $env:MESON_TAG https://github.com/mesonbuild/meson.git "$env:RUNNER_TEMP\meson"
          git -C "$env:RUNNER_TEMP\meson" apply "$env:GITHUB_WORKSPACE\one-s\meson\uwp-on-1.4.2.patch"
          "MESON=$env:RUNNER_TEMP\meson\meson.py" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same key as one-s.yml's desktop job, so whichever workflow builds first feeds the other.
      - name: Restore Mesa build
        id: mesa
        uses: actions/cache/restore@v4
        with:
          path: install_desk
          key: mesa-desktop-v1-${{ hashFiles('src/**', 'include/**', 'meson.build', 'meson.options', 'subprojects/*.wrap', 'bin/**', 'one-s/meson/*.patch') }}

      - name: Build Mesa (desktop, debug)
        if: steps.mesa.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $t = Get-Date
          python $env:MESON setup build_desk --backend=ninja --buildtype=debug --prefix "$env:GITHUB_WORKSPACE\install_desk" `
            "-Dvulkan-drivers=[]" "-Dtools=[]" -Dgallium-d3d12-video=disabled
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ninja -C build_desk install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "build minutes $([int]((Get-Date) - $t).TotalMinutes)"

      - name: Save Mesa build
        if: steps.mesa.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: install_desk
          key: ${{ steps.mesa.outputs.cache-primary-key }}

      - name: Build glprobe and dxbccheck
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force run | Out-Null
          Push-Location run
          cmd /c "$env:GITHUB_WORKSPACE\one-s\glprobe\build.cmd" "$env:GITHUB_WORKSPACE\include"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmd /c "$env:GITHUB_WORKSPACE\one-s\dxbc\build.cmd"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item install_desk\bin\*.dll run\
          $dxil = Get-ChildItem "$env:WindowsSdkDir\bin" -Recurse -Filter dxil.dll | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $dxil) { throw "no x64 dxil.dll in the Windows SDK" }
          Copy-Item $dxil.FullName run\

      - name: Zero-digest experiment with FXC blobs (D3D11 FL 11_0 and D3D12, both WARP)
        shell: pwsh
        run: |
          run\dxbccheck.exe --fxc-experiment | Tee-Object -FilePath results-fxc.tsv
          "## FXC blobs: digest handling`n`n``````" >> $env:GITHUB_STEP_SUMMARY
          Get-Content results-fxc.tsv >> $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY

      - name: "glprobe scenes on DXIL, SM 5.1 and SM 5.0, with blob dumps and compile times"
        shell: pwsh
        env:
          GALLIUM_DRIVER: d3d12
          WGL_DISABLE_ERROR_DIALOGS: 1
        run: |
          python one-s\dxbc\collect.py --exe run\glprobe.exe --out results --scenes $env:SCENES
          exit $LASTEXITCODE

      - name: Check every dumped blob (D3DDisassemble, D3D11 FL 11_0)
        shell: pwsh
        run: |
          $blobs = Get-ChildItem results -Recurse -Filter dump*.dxil
          "blobs: $($blobs.Count)"
          if ($blobs.Count -eq 0) { "no blobs were dumped (the DXBC backend never ran)" >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          New-Item -ItemType Directory -Force results\asm | Out-Null
          # Rename to <mode>_<scene>_<n>.dxbc so the names survive the artifact and the disasm job.
          foreach ($b in $blobs) {
            $mode = $b.Directory.Parent.Parent.Name
            $scene = $b.Directory.Name
            Copy-Item $b.FullName "results\asm\${mode}_${scene}_$($b.BaseName).dxbc"
          }
          $files = Get-ChildItem results\asm -Filter *.dxbc | ForEach-Object { $_.FullName }
          run\dxbccheck.exe --asm-dir results\asm @files | Tee-Object -FilePath results\dxbccheck.tsv
          $rc = $LASTEXITCODE
          "## Mesa DXBC blobs: dxbccheck`n`n``````" >> $env:GITHUB_STEP_SUMMARY
          Get-Content results\dxbccheck.tsv >> $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY
          exit $rc

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxbc-results
          path: |
            results
            results-fxc.tsv
          if-no-files-found: ignore

  # Second structural check with dxbc-spirv (MIT), and the oracle's first half: the captured GLSL goes
  # through glslang and SPIRV-Cross to SM 5.1 HLSL for the fxc job.
  linux:
    needs: windows
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dxbc-results
          path: results
      - name: Tools (meson, glslang, SPIRV-Cross) and dxbc-spirv's disassembler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq meson ninja-build glslang-tools spirv-cross >/dev/null
          git clone --quiet --recursive --depth 1 https://github.com/doitsujin/dxbc-spirv.git
          meson setup dxbc-spirv/build dxbc-spirv >/dev/null
          ninja -C dxbc-spirv/build
          echo "DISASM=$(find dxbc-spirv/build -type f -name dxbc_disasm | head -1)" >> "$GITHUB_ENV"
      - name: Disassemble every blob with dxbc-spirv
        run: |
          shopt -s nullglob
          test -x "$DISASM"
          ok=0; bad=0
          for f in results/results/asm/*.dxbc results/asm/*.dxbc; do
            if "$DISASM" "$f" > "$f.spv.asm" 2> "$f.spv.err"; then ok=$((ok+1)); else bad=$((bad+1)); echo "FAIL $f: $(head -c 300 "$f.spv.err")"; fi
          done
          echo "dxbc-spirv disassembled $ok blobs, $bad failed" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$bad" -eq 0
      - name: Oracle, GLSL to SM 5.1 HLSL
        if: always()
        run: |
          cap=$(find results -type d -name capture | head -1)
          if [ -z "$cap" ]; then echo "no captured GLSL" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 one-s/dxbc/oracle_convert.py --capture "$cap" --out oracle-hlsl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxbc-spirv-disasm
          path: results/**/*.spv.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-hlsl
          path: oracle-hlsl
          if-no-files-found: ignore

  fxc:
    needs: linux
    if: always()
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: oracle-hlsl
          path: oracle-hlsl
      - name: Oracle, fxc on the converted HLSL
        shell: pwsh
        run: |
          python one-s\dxbc\oracle_fxc.py --hlsl oracle-hlsl --out oracle-fxc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-fxc
          path: oracle-fxc
          if-no-files-found: ignore
